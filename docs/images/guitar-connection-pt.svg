<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" width="920" height="210" role="img" aria-label="Diagrama de conexão física da guitarra ao NotesId">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="920" height="210" rx="14" fill="#0f172a"/>
  <text x="460" y="28" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">
    Caminho da Conexão Física (Processamento 100% Local — Nenhum Áudio Vai para a Internet)
  </text>

  <!-- Box 1: Guitarra -->
  <rect x="20" y="52" width="150" height="106" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="95" y="78" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. Guitarra</text>
  <text x="95" y="100" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Volume aberto</text>
  <text x="95" y="118" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Som limpo (sem FX)</text>
  <text x="95" y="136" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Captador Ponte/Braço</text>

  <!-- Arrow 1 -->
  <line x1="170" y1="105" x2="225" y2="105" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="197" y="95" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Cabo P10</text>
  <text x="197" y="122" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">6,35 mm</text>

  <!-- Box 2: Interface USB -->
  <rect x="232" y="52" width="195" height="106" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="329" y="78" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. Interface de Áudio USB</text>
  <text x="329" y="100" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Entrada Instrumento / Hi-Z</text>
  <text x="329" y="118" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Gain: pico em −12 a −6 dB</text>
  <text x="329" y="136" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Sem clipping / Sem efeitos</text>

  <!-- Arrow 2 -->
  <line x1="427" y1="105" x2="482" y2="105" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="454" y="95" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">USB</text>
  <text x="454" y="122" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">48 kHz</text>

  <!-- Box 3: Navegador -->
  <rect x="489" y="52" width="185" height="106" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="581" y="78" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3. Chrome / Edge</text>
  <text x="581" y="100" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Web Audio (AudioWorklet)</text>
  <text x="581" y="118" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Filtros de voz desligados</text>
  <text x="581" y="136" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">http://localhost:8000</text>

  <!-- Arrow 3 -->
  <line x1="674" y1="105" x2="729" y2="105" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="701" y="95" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Local</text>
  <text x="701" y="122" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">WS</text>

  <!-- Box 4: Servidor NotesId -->
  <rect x="736" y="52" width="164" height="106" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="818" y="78" text-anchor="middle" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4. Servidor NotesId</text>
  <text x="818" y="100" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">YIN f0 + FFT longa</text>
  <text x="818" y="118" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Ajuste de B e decaimento</text>
  <text x="818" y="136" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="10">Nota • Corda • Casa</text>

  <!-- Rodapé -->
  <text x="460" y="188" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    Dica: evite ligar a guitarra direto na entrada P2 de microfone do PC (casamento de impedância ruim gera som abafado e muito ruído).
  </text>
</svg>
