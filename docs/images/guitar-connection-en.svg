<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" width="920" height="210" role="img" aria-label="Physical guitar connection diagram to NotesId">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="920" height="210" rx="14" fill="#0f172a"/>
  <text x="460" y="28" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">
    Physical Connection Path (100% Local Processing — No Audio Sent to the Internet)
  </text>

  <!-- Box 1: Guitar -->
  <rect x="20" y="52" width="150" height="106" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="95" y="78" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. Guitar</text>
  <text x="95" y="100" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Volume open</text>
  <text x="95" y="118" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Clean tone (no FX)</text>
  <text x="95" y="136" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Bridge/Neck pickup</text>

  <!-- Arrow 1 -->
  <line x1="170" y1="105" x2="225" y2="105" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="197" y="95" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">1/4" TS</text>
  <text x="197" y="122" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">cable</text>

  <!-- Box 2: USB Interface -->
  <rect x="232" y="52" width="195" height="106" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="329" y="78" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. USB Audio Interface</text>
  <text x="329" y="100" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Instrument / Hi-Z input ON</text>
  <text x="329" y="118" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Gain knob: peak ~ -12 to -6 dB</text>
  <text x="329" y="136" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">No clipping / No FX monitoring</text>

  <!-- Arrow 2 -->
  <line x1="427" y1="105" x2="482" y2="105" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="454" y="95" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">USB</text>
  <text x="454" y="122" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">48 kHz</text>

  <!-- Box 3: Browser -->
  <rect x="489" y="52" width="185" height="106" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="581" y="78" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3. Chrome / Edge</text>
  <text x="581" y="100" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Web Audio (AudioWorklet)</text>
  <text x="581" y="118" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Voice filters OFF</text>
  <text x="581" y="136" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">http://localhost:8000</text>

  <!-- Arrow 3 -->
  <line x1="674" y1="105" x2="729" y2="105" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="701" y="95" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Local</text>
  <text x="701" y="122" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">WS</text>

  <!-- Box 4: NotesId Local Server -->
  <rect x="736" y="52" width="164" height="106" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="818" y="78" text-anchor="middle" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4. NotesId Server</text>
  <text x="818" y="100" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">YIN f0 + Long FFT</text>
  <text x="818" y="118" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Inharmonicity B fit</text>
  <text x="818" y="136" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="10">Note • String • Fret</text>

  <!-- Footer note -->
  <text x="460" y="188" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    Tip: Avoid plugging a guitar directly into a PC 3.5 mm mic jack (impedance mismatch causes dull tone and heavy noise).
  </text>
</svg>
