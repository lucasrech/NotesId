[project]
name = "guitar-string-identifier"
version = "0.1.0"
description = "Identificador de corda e casa de guitarra por processamento clássico de sinais (sem machine learning)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "lucasrech", email = "coradin.rech@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "numpy>=2.5.5",
    "pydantic>=2.14.4",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
guitar-string-identifier = "guitar_string_identifier.web.app:run_server"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
